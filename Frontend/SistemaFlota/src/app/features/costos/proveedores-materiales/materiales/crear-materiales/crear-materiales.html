<div class="overlay">
    <div class="modal">

        <!-- Header -->
        <div class="modal-header">
            <div>
                <h2>{{ data ? 'Editar Material' : 'Nuevo Material' }}</h2>
                <p>{{ data ? 'Actualice la información del material' : 'Complete la información del material' }}</p>
            </div>

            <button class="cerrar" (click)="cerrar()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Formulario -->
        <form (ngSubmit)="guardar()">

            <div class="campo ancho">
                <label>Proveedor</label>

                <select name="idProveedor" [(ngModel)]="material.idProveedor">

                    <option [ngValue]="0">
                        Seleccione proveedor
                    </option>

                    <option *ngFor="let item of proveedores" [ngValue]="item.idProveedor">

                        {{ item.nombre }}

                    </option>

                </select>
            </div>

            <div class="grid2">

                <div class="campo">
                    <label>Nombre Material</label>
                    <input type="text" name="nombreMaterial" [(ngModel)]="material.nombreMaterial"
                        placeholder="Ej: Polietileno de Baja Densidad">
                </div>

                <div class="campo">
                    <label>Densidad</label>

                    <select name="densidad" [(ngModel)]="material.densidad">
                        <option value="" disabled>Seleccione la densidad</option>
                        <option>Baja</option>
                        <option>Alta</option>
                        <option>Otro</option>

                    </select>
                </div>

            </div>

            <!-- NUEVO -->
            <div class="campo ancho">
                <label>Descripción Compra</label>

                <textarea name="descripcionCompra" [(ngModel)]="material.descripcionCompra"
                    placeholder="Ej. Polietileno negro para fabricación de bolsas industriales." rows="3">
                </textarea>
            </div>

            <div class="grid2">

                <div class="campo">
                    <label>Categoría</label>

                    <input type="text" name="categoria" [(ngModel)]="material.categoria"
                        placeholder="Ej. Resina plástica">
                </div>

                <div class="campo">
                    <label>Color</label>

                    <input type="text" name="color" [(ngModel)]="material.color" placeholder="Ej. Negro">
                </div>

            </div>

            <div class="grid2">

                <div class="campo">
                    <label>Tipo</label>

                    <input type="text" name="tipoProduccion" [(ngModel)]="material.tipoProduccion"
                        placeholder="Ej. Extrusión">
                </div>

                <!-- NUEVO -->
                <div class="campo">
                    <label>Unidad</label>

                    <input type="text" name="unidad" [(ngModel)]="material.unidad" placeholder="Ej. Kilogramo (Kg)">
                </div>

            </div>

            <div class="grid3">

                <div class="campo">
                    <label>Precio Base/KG (COP)</label>

                    <input type="number" name="precioBaseKg" [(ngModel)]="material.precioBaseKg" placeholder="Ej. 3500">
                </div>
            </div>

            <div class="campo ancho">

                <label>Estado</label>
                <select name="activo" [(ngModel)]="material.activo">
                    <option [ngValue]="true">Activo</option>
                    <option [ngValue]="false">Inactivo</option>
                </select>
            </div>

            <div class="campo ancho">

                <label>Ficha técnica (PDF)</label>

                <label class="pdf-upload">

                    <input type="file" accept=".pdf" (change)="seleccionarArchivo($event)">
                    <i class="fa-solid fa-cloud-arrow-up"></i>

                    <div class="pdf-info">

                        <strong>Seleccione un archivo PDF</strong>
                        <span>Arrastre el archivo o haga clic para buscarlo</span>

                    </div>

                </label>

                <small class="pdf-ayuda" *ngIf="!nombreArchivo">
                    Formato permitido: PDF
                </small>

                <div class="pdf-seleccionado" *ngIf="nombreArchivo">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>{{ nombreArchivo }}</span>
                </div>

                <a *ngIf="material.documentoPdf && !nombreArchivo" class="pdf-actual"
                    [href]="'https://localhost:5214/' + material.documentoPdf" target="_blank">

                    <i class="fa-solid fa-file-pdf"></i>
                    Ver ficha técnica actual

                </a>

            </div>
            <div class="botones">
                <button class="btn-cancelar" (click)="cerrar()" type="button">
                    Cancelar
                </button>

                <button type="submit" class="guardar">
                    {{ data ? 'Actualizar' : 'Guardar' }}
                </button>
            </div>
        </form>
    </div>
</div>
