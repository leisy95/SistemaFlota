<section class="resumen">

    <div class="card pedidos">

        <div class="icono">
            <i class="fa-solid fa-file-invoice"></i>
        </div>

        <div class="info">

            <span class="titulo">
                Órdenes de compra
            </span>

            <h2>
                {{ resumen.ordenesCompra }}
            </h2>

            <small>
                {{ resumen.ordenesPendientes }} pendientes
            </small>

        </div>

    </div>

    <div class="card vehiculos">

        <div class="icono">
            <i class="fa-solid fa-truck"></i>
        </div>

        <div class="info">

            <span class="titulo">
                Vehículos
            </span>

            <h2>
                {{ resumen.vehiculos }}
            </h2>

            <small>
                Todos operativos
            </small>

        </div>

    </div>


    <div class="card empleados">

        <div class="icono">
            <i class="fa-solid fa-users"></i>
        </div>

        <div class="info">

            <span class="titulo">
                Empleados
            </span>

            <h2>
                {{ resumen.empleados }}
            </h2>

            <small>
                Personal activo
            </small>

        </div>

    </div>


    <div class="card alertas">

        <div class="icono">
            <i class="fa-solid fa-screwdriver-wrench"></i>
        </div>

        <div class="info">

            <span class="titulo">
                Mantenimientos
            </span>

            <h2>
                {{ resumen.mantenimientos }}
            </h2>

            <small>
                {{ resumen.mantenimientosProximos }} próximos
            </small>

        </div>

    </div>

</section>
