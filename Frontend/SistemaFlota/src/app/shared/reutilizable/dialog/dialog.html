<div class="dialog-backdrop" *ngIf="visible">

    <div class="dialog">

        <div class="icono" [ngClass]="tipo">
            <i *ngIf="tipo === 'success'" class="fa-solid fa-circle-check"></i>
            <i *ngIf="tipo === 'warning'" class="fa-solid fa-triangle-exclamation"></i>
            <i *ngIf="tipo === 'error'" class="fa-solid fa-circle-xmark"></i>
            <i *ngIf="tipo === 'info'" class="fa-solid fa-circle-info"></i>
            <i *ngIf="tipo === 'question'" class="fa-solid fa-circle-question"></i>
        </div>

        <h2>{{ titulo }}</h2>

        <p>{{ mensaje }}</p>

        <div class="dialog-actions">
            <button *ngIf="mostrarCancelar" class="btn btn-secondary" (click)="cancelar()">
                {{ textoCancelar }}
            </button>

            <button class="btn btn-primary" (click)="aceptar()">
                {{ textoBoton }}
            </button>
        </div>

    </div>

</div>
