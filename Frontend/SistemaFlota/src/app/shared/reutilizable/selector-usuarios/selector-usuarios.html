<div class="card">
    <div class="card-header">
        <h3>
            <i class="fa-solid fa-envelope"></i>
            Destinatarios
        </h3>

        <span>
            {{ usuarios.filter(x => x.seleccionado).length }} seleccionados
        </span>
    </div>

    <div class="buscar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" [(ngModel)]="filtro" placeholder="Buscar usuario...">
    </div>

    <div class="lista">
        <label class="usuario" *ngFor="let usuario of usuariosFiltrados">
            <input type="checkbox" [(ngModel)]="usuario.seleccionado" (change)="cambiarSeleccion()">

            <div class="info">
                <strong>
                    <i class="fa-solid fa-user"></i>
                    {{ usuario.username }}
                </strong>

                <small>
                    <i class="fa-solid fa-at"></i>
                    {{ usuario.email }}
                </small>

                <small>
                    <i class="fa-solid fa-user-shield"></i>
                    {{ usuario.rol }}
                </small>
            </div>
        </label>
    </div>

    <div class="footer">

        <button class="btn-cancelar" (click)="cerrar()">
            <i class="fa-solid fa-arrow-left"></i>
            Cancelar
        </button>

        <button class="btn-agregar" (click)="enviar()">
            <i class="fa-solid fa-paper-plane"></i>
            Enviar correo
        </button>

    </div>
</div>
