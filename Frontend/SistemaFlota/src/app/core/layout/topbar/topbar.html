<header class="topbar">

    <div class="topbar-left">

        <button class="btn-hamburguesa" (click)="toggleSidebar.emit()">
            <i class="fa-solid fa-bars"></i>
        </button>

        <div class="topbar-modulo">
            <i [class]="iconoModulo"></i>
            <span>{{ nombreModulo }}</span>
        </div>

    </div>

    <div class="topbar-right">

        <button class="accion calendario">
            <i class="fa-regular fa-calendar"></i>
        </button>

        <button class="accion mensajes">
            <i class="fa-regular fa-envelope"></i>
            <span>3</span>
        </button>

        <button class="accion notificaciones">
            <i class="fa-regular fa-bell"></i>
            <span>7</span>
        </button>

        <div class="usuario">

            <div class="avatar">
                <i class="fa-solid fa-user"></i>
            </div>

            <div class="datos">
                <strong>{{ usuario }}</strong>
                <small>{{ rol }}</small>
            </div>

            <button class="btn-salir" (click)="cerrarSesion()">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>

        </div>

    </div>

</header>
