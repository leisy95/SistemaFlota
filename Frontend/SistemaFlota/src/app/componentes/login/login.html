<div class="login-container">

  <div class="login-card">

    <h2>🚚 Sistema de Flota</h2>
    <p class="subtitle">Iniciar sesión</p>

    <input 
      [(ngModel)]="username" 
      placeholder="Usuario">

    <input 
      [(ngModel)]="password" 
      type="password" 
      placeholder="Contraseña">

    <button (click)="iniciarSesion()">Ingresar</button>

  </div>

</div>
